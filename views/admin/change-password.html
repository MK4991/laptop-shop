<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <title>Set Your Password | LIQ TECHNOLOGIES</title>
    <link rel="stylesheet" href="/css/admin-change-password.css">
    <link rel="stylesheet" href="/css/admin-theme.css">
    <script src="/js/admin-theme.js" defer></script>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="login-brand"><div class="brand-icon">L</div><div><h2 class="store-brand-name">LIQ TECHNOLOGIES</h2><span>SECURE YOUR ACCOUNT</span></div></div>
            <div class="login-header"><p class="login-label">FIRST SIGN-IN</p><h1>Choose a new password</h1><p>Your temporary password must be replaced before you can access the store dashboard.</p></div>
            <p id="passwordMessage" class="login-message" role="status"></p>
            <form id="changePasswordForm" class="login-form">
                <label for="newPassword">New password</label>
                <input id="newPassword" name="password" type="password" minlength="12" autocomplete="new-password" required>
                <small>Use at least 12 characters.</small>
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
                <button type="submit" class="login-button">Save new password</button>
            </form>
            <button id="changePasswordLogout" class="login-back-link" type="button">Sign out</button>
        </section>
    </main>
    <script src="/js/store-context.js"></script>
    <script src="/js/admin-change-password.js"></script>
</body>
</html>
